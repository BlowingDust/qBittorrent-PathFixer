[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qbittorrent-pathfixer"
version = "0.1.0"
description = "Safely audit and fix qBittorrent file paths with reviewable rename plans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
qbittorrent-pathfixer = "qbittorrent_pathfixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
